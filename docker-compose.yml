version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      - REDIS_URL=redis://cache:6379/0
      - FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    depends_on:
      - cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/config')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cache:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
