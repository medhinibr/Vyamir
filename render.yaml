services:
  - type: web
    name: vyamir-app
    runtime: docker
    plan: free
    startCommand: "gunicorn --bind 0.0.0.0:8080 app:app"
    envVars:
      - key: PEXELS_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
