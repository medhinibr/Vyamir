name: Deploy Vyamir to Render

on:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Install Test Dependencies
        run: pip install pytest

      - name: Run Tests with pytest
        run: pytest

      - name: Build Docker Image
        run: docker build -t vyamir-app .

  deploy:
    name: Continuous Deployment
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          KEY_OR_URL="${{ secrets.RENDER_API_KEY }}"
          if [[ "$KEY_OR_URL" == http* ]]; then
            echo "Triggering deployment via full hook URL."
            curl -f -X POST "$KEY_OR_URL"
          else
            echo "Triggering deployment via service ID and key."
            curl -f -X POST "https://api.render.com/deploy/srv-d59vfdmr433s7383maq0?key=$KEY_OR_URL"
          fi
